<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <input class="input" placeholder="Buscar por inquilino..." onChange="{{ data.onQueryChange }}" style="margin-bottom:10px" />
  <div style="display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px">
    <sc-for list="{{ data.tabs }}" as="t" hint-placeholder-count="5">
      <button type="button" onClick="{{ t.onSelect }}" style="flex:none;font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }} ({{ t.count }})</button>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{ data.list }}" as="p" hint-placeholder-count="6">
      <div style="display:flex;align-items:center;gap:8px;background:var(--color-surface);border-radius:var(--radius-md);padding:12px 14px">
        <button type="button" onClick="{{ p.onOpen }}" style="all:unset;box-sizing:border-box;cursor:pointer;flex:1;min-width:0;display:flex;align-items:center;justify-content:space-between;gap:10px">
          <div style="min-width:0">
            <div style="font-size:13.5px;font-family:var(--font-heading)">{{ p.tenantName }}</div>
            <div style="font-size:11.5px;opacity:0.6">{{ p.roomLabel }} · {{ p.period }}</div>
          </div>
          <div style="text-align:right;flex:none;width:96px">
            <div style="font-size:14px;color:var(--color-accent-700);font-family:var(--font-heading)">{{ p.amountFmt }}</div>
            <span class="tag tag-neutral" style="color:{{ p.meta.color }};margin-top:3px;white-space:nowrap">{{ p.meta.label }}</span>
          </div>
        </button>
        <div style="flex:none;width:34px;height:34px">
        <sc-if value="{{ p.needsReminder }}">
          <button type="button" onClick="{{ p.onRemind }}" aria-label="Recordar por WhatsApp" title="Recordar por WhatsApp" style="all:unset;box-sizing:border-box;cursor:pointer;flex:none;width:34px;height:34px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);display:flex;align-items:center;justify-content:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></button>
        </sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
</body>
</html>
