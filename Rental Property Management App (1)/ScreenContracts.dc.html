<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <div style="display:flex;gap:7px;margin-bottom:14px">
    <sc-for list="{{ data.filters }}" as="f" hint-placeholder-count="4">
      <button type="button" onClick="{{ f.onSelect }}" style="font-size:12px;padding:7px 13px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:{{ f.bg }};color:{{ f.fg }}">{{ f.label }}</button>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{ data.list }}" as="c" hint-placeholder-count="5">
      <div style="background:var(--color-surface);border-radius:var(--radius-md);padding:12px 14px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
          <span style="font-size:13.5px;font-family:var(--font-heading)">{{ c.tenantName }}</span>
          <span class="tag tag-neutral" style="color:{{ c.meta.color }}">{{ c.meta.label }}</span>
        </div>
        <div style="font-size:11.5px;opacity:0.65;margin-bottom:6px">{{ c.roomLabel }}</div>
        <div style="display:flex;justify-content:space-between;font-size:12px">
          <span>{{ c.start }} — {{ c.end }}</span>
          <span>Depósito {{ c.depositFmt }}</span>
        </div>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
</body>
</html>
