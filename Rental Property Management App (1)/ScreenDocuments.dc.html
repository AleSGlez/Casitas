<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <sc-if value="{{ data.activeCategory }}" hint-placeholder-val="{{ false }}">
    <button type="button" onClick="{{ data.onBack }}" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--color-accent);margin-bottom:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="m12 19-7-7 7-7"/></svg>Categorías</button>
    <h5 style="margin:0 0 10px">{{ data.activeCategory }}</h5>
    <div style="display:flex;flex-direction:column;gap:8px">
      <sc-for list="{{ data.items }}" as="d" hint-placeholder-count="3">
        <div style="display:flex;align-items:center;gap:9px;background:var(--color-surface);border-radius:var(--radius-sm);padding:11px 13px">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.75" style="flex:none"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>
          <div style="min-width:0;flex:1">
            <div style="font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ d.name }}</div>
            <div style="font-size:11px;opacity:0.6">{{ d.relatedTo }} · {{ d.date }}</div>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <sc-if value="{{ data.noActiveCategory }}" hint-placeholder-val="{{ true }}">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <sc-for list="{{ data.categories }}" as="c" hint-placeholder-count="7">
        <button type="button" onClick="{{ c.onOpen }}" style="all:unset;box-sizing:border-box;cursor:pointer;background:var(--color-surface);border-radius:var(--radius-md);padding:16px 12px;display:flex;flex-direction:column;gap:6px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--color-accent)" stroke-width="2.75"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg>
          <span style="font-size:12.5px;font-family:var(--font-heading)">{{ c.name }}</span>
          <span style="font-size:11px;opacity:0.6">{{ c.count }} archivos</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
</body>
</html>
