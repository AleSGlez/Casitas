<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <sc-if value="{{ data.filterOpen }}" hint-placeholder-val="{{ false }}">
    <div class="om-fade" style="padding:12px var(--space-4);border-bottom:1px solid var(--color-divider);display:flex;flex-direction:column;gap:10px;background:var(--color-surface)">
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ data.complexOptions }}" as="c" hint-placeholder-count="4">
          <button type="button" onClick="{{ c.onSelect }}" style="font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:{{ c.bg }};color:{{ c.fg }}">{{ c.name }}</button>
        </sc-for>
      </div>
      <div style="display:flex;flex-wrap:wrap;gap:7px">
        <sc-for list="{{ data.statusOptions }}" as="s" hint-placeholder-count="5">
          <button type="button" onClick="{{ s.onSelect }}" style="display:flex;align-items:center;gap:6px;font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:var(--color-bg)">
            <span style="width:7px;height:7px;border-radius:999px;background:{{ s.color }}"></span>{{ s.label }}
          </button>
        </sc-for>
      </div>
      <div style="display:flex;gap:7px">
        <sc-for list="{{ data.furnishedOptions }}" as="f" hint-placeholder-count="3">
          <button type="button" onClick="{{ f.onSelect }}" style="font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:var(--color-bg)">{{ f.label }}</button>
        </sc-for>
      </div>
      <div>
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>Renta máxima</span><strong>{{ data.maxPriceFmt }}</strong></div>
        <input type="range" min="3000" max="16000" step="500" defaultValue="16000" onChange="{{ data.onPriceChange }}" style="width:100%;accent-color:var(--color-accent)" />
      </div>
    </div>
  </sc-if>

  <div style="padding:12px var(--space-4) 0;display:flex;align-items:center;justify-content:space-between">
    <span style="font-size:12px;opacity:0.65">{{ data.count }} habitaciones</span>
    <div class="seg" style="font-size:12px">
      <label class="seg-opt"><input type="radio" name="rview" checked="{{ data.isList }}" onChange="{{ data.setListView }}" />Lista</label>
      <label class="seg-opt"><input type="radio" name="rview" checked="{{ data.isBoard }}" onChange="{{ data.setBoardView }}" />Tablero</label>
    </div>
  </div>

  <sc-if value="{{ data.isList }}" hint-placeholder-val="{{ true }}">
    <div style="padding:12px var(--space-4);display:flex;flex-direction:column;gap:10px">
      <sc-for list="{{ data.list }}" as="r" hint-placeholder-count="6">
        <button type="button" onClick="{{ r.onOpen }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;gap:12px;background:var(--color-surface);border-radius:var(--radius-md);padding:12px">
          <div style="width:56px;height:56px;border-radius:var(--radius-sm);background:var(--color-accent-200);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--font-heading);font-size:13px;color:var(--color-accent-800)">{{ r.number }}</div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px">
            <div style="display:flex;align-items:center;justify-content:between;gap:8px">
              <span style="font-size:14px;font-family:var(--font-heading);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span>
            </div>
            <span style="font-size:11.5px;opacity:0.65">{{ r.complexName }}</span>
            <div style="display:flex;align-items:center;gap:6px;margin-top:2px">
              <span style="width:7px;height:7px;border-radius:999px;background:{{ r.meta.color }}"></span>
              <span style="font-size:11.5px" >{{ r.meta.label }}</span>
              <span style="font-size:11.5px;opacity:0.4">·</span>
              <span style="font-size:13px;font-family:var(--font-heading);color:var(--color-accent-700)">{{ r.rentFmt }}</span>
            </div>
          </div>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ data.isBoard }}">
    <div style="padding:12px var(--space-4);display:flex;flex-direction:column;gap:16px">
      <sc-for list="{{ data.board }}" as="col" hint-placeholder-count="5">
        <div>
          <div style="display:flex;align-items:center;gap:7px;margin-bottom:8px">
            <span style="width:8px;height:8px;border-radius:999px;background:{{ col.meta.color }}"></span>
            <h6 style="margin:0">{{ col.meta.label }}</h6>
          </div>
          <div style="display:flex;gap:9px;overflow-x:auto;padding-bottom:4px">
            <sc-for list="{{ col.items }}" as="r" hint-placeholder-count="2">
              <button type="button" onClick="{{ r.onOpen }}" style="all:unset;cursor:pointer;flex:none;width:130px;background:var(--color-surface);border-radius:var(--radius-md);padding:10px;border-top:3px solid {{ col.meta.color }}">
                <div style="font-size:12.5px;font-family:var(--font-heading)">{{ r.number }} · {{ r.complexName }}</div>
                <div style="font-size:12px;color:var(--color-accent-700);margin-top:4px">{{ r.rentFmt }}</div>
              </button>
            </sc-for>
          </div>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
</body>
</html>
