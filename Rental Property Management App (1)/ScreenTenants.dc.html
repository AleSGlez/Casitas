<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <input class="input" placeholder="Buscar inquilino..." onChange="{{ data.onQueryChange }}" style="margin-bottom:10px" />
  <div class="seg" style="margin-bottom:14px;display:inline-flex">
    <sc-for list="{{ data.tabs }}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{ t.onSelect }}" style="all:unset;box-sizing:border-box;cursor:pointer;font-size:12.5px;padding:7px 13px;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{ data.list }}" as="t" hint-placeholder-count="6">
      <button type="button" onClick="{{ t.onOpen }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:11px;background:var(--color-surface);border-radius:var(--radius-md);padding:11px 13px">
        <span style="width:38px;height:38px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);display:flex;align-items:center;justify-content:center;font-size:13px;font-family:var(--font-heading);flex:none">{{ t.initials }}</span>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ t.name }}</div>
          <div style="font-size:11.5px;opacity:0.6">{{ t.roomLabel }} · {{ t.occupation }}</div>
        </div>
      </button>
    </sc-for>
  </div>
</div>

</x-dc>
</body>
</html>
