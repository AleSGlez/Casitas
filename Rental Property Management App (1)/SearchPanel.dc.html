<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <input class="input" placeholder="Buscar habitaciones, inquilinos, complejos, CURP..." value="{{ query }}" onChange="{{ onQueryChange }}" autoFocus style="margin-bottom:14px" />
  <sc-if value="{{ hasQuery }}">
    <div style="display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto">
      <sc-for list="{{ results }}" as="r" hint-placeholder-count="4">
        <div style="display:flex;align-items:center;justify-content:space-between;background:var(--color-surface);border-radius:var(--radius-sm);padding:10px 12px">
          <div style="min-width:0">
            <div style="font-size:12.5px">{{ r.title }}</div>
            <div style="font-size:11px;opacity:0.6">{{ r.subtitle }}</div>
          </div>
          <span class="tag tag-neutral">{{ r.kind }}</span>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { query: '' };
  renderVals() {
    const q = this.state.query.trim().toLowerCase();
    const d = this.props.data || { rooms: [], tenants: [], complexes: [] };
    let results = [];
    if (q) {
      results = [
        ...d.rooms.filter(r => r.name.toLowerCase().includes(q) || r.number.toLowerCase().includes(q)).map(r => ({ title: r.name, subtitle: r.complexName, kind: 'Habitación' })),
        ...d.tenants.filter(t => t.name.toLowerCase().includes(q) || (t.curp || '').toLowerCase().includes(q) || (t.phone || '').includes(q)).map(t => ({ title: t.name, subtitle: t.phone, kind: 'Inquilino' })),
        ...d.complexes.filter(c => c.name.toLowerCase().includes(q) || c.address.toLowerCase().includes(q)).map(c => ({ title: c.name, subtitle: c.address, kind: 'Complejo' })),
      ];
    }
    return { query: this.state.query, onQueryChange: (e) => this.setState({ query: e.target.value }), hasQuery: q.length > 0, results };
  }
}

</script>
</body>
</html>
