<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <sc-for list="{{ data.groups }}" as="g" hint-placeholder-count="3">
    <div style="margin-bottom:18px">
      <h6 style="margin:0 0 8px;opacity:0.55">{{ g.label }}</h6>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
          <button type="button" onClick="{{ it.onGo }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--color-surface);border-radius:var(--radius-md);padding:13px 14px">
            <div>
              <div style="font-size:13.5px;font-family:var(--font-heading)">{{ it.label }}</div>
              <div style="font-size:11.5px;opacity:0.6">{{ it.sub }}</div>
            </div>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" style="opacity:0.4"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-for>
</div>

</x-dc>
</body>
</html>
