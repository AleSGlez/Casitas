<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <sc-if value="{{ data.loaded }}" hint-placeholder-val="{{ false }}">
    <div class="card elev-sm" style="margin-bottom:14px;background:var(--color-accent-2-100)">
      <div class="card-kicker" style="color:var(--color-accent-2-800)">Total en todas las cuentas</div>
      <div class="card-title" style="font-size:28px">{{ data.totalFmt }}</div>
    </div>
    <button type="button" class="btn btn-primary btn-block" onClick="{{ data.onAdd }}" style="margin-bottom:16px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M5 12h14"/><path d="M12 5v14"/></svg>Nueva cuenta
    </button>

    <div style="display:flex;flex-direction:column;gap:12px">
      <sc-for list="{{ data.list }}" as="a" hint-placeholder-count="4">
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start">
            <div>
              <div class="card-kicker">{{ a.typeLabel }} · {{ a.scopeLabel }}</div>
              <div class="card-title">{{ a.alias }}</div>
            </div>
            <div style="font-family:var(--font-heading);font-size:19px;color:var(--color-accent-700);text-align:right">{{ a.balanceFmt }}</div>
          </div>
          <sc-if value="{{ a.isCash }}" hint-placeholder-val="{{ false }}">
            <div></div>
          </sc-if>
          <div style="display:flex;flex-direction:column;gap:3px;margin-top:2px">
            <div style="font-size:11.5px;opacity:0.6">{{ a.bank }} {{ a.holder }}</div>
            <div style="font-size:11.5px;opacity:0.6">{{ a.clabe }}</div>
          </div>

          <sc-if value="{{ a.movements }}">
            <div style="margin-top:6px;display:flex;flex-direction:column;gap:5px">
              <div style="font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;opacity:0.5">Movimientos recientes</div>
              <sc-for list="{{ a.movements }}" as="m" hint-placeholder-count="2">
                <div style="display:flex;justify-content:space-between;font-size:12px;padding:5px 0;border-bottom:1px solid var(--color-divider)">
                  <span style="opacity:0.75">{{ m.note }}</span>
                  <span style="color:{{ m.color }};font-family:var(--font-heading)">{{ m.sign }}{{ m.amountFmt }}</span>
                </div>
              </sc-for>
            </div>
          </sc-if>

          <button type="button" class="btn btn-secondary" onClick="{{ a.onWithdraw }}" style="align-self:flex-start;margin-top:6px">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></svg>Retirar
          </button>
        </div>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
</body>
</html>
