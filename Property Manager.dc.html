<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/organic-5094e62e-56f6-4565-abf8-6c0f1162090e/styles.css">
  <script src="_ds/organic-5094e62e-56f6-4565-abf8-6c0f1162090e/_ds_bundle.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap');
    body{margin:0;background:#e9ded0}
    @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .om-fade{animation:fadeUp .18s ease-out}
    .om-scroll::-webkit-scrollbar{display:none}
  </style>
</helmet>
<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 16px;font-family:var(--font-body)">
<x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" hint-size="412,892">
  <div style="height:100%;display:flex;flex-direction:column;background:var(--color-bg);position:relative;font-family:var(--font-body);color:var(--color-text);transform:scale({{ ui.a11yZoom }});transform-origin:top left;width:{{ ui.a11yWidth }};height:{{ ui.a11yHeight }};--color-text:{{ ui.a11yText }};--color-divider:{{ ui.a11yDivider }};--font-body:{{ ui.a11yFontBody }};--font-heading:{{ ui.a11yFontHeading }}">

  <sc-if value="{{ ui.showLogin }}" hint-placeholder-val="{{ true }}">
    <dc-import name="ScreenLogin" handlers="{{ handlers }}" hint-size="100%,100%"></dc-import>
  </sc-if>

  <sc-if value="{{ ui.loggedIn }}">
    <!-- Header -->
    <div style="flex:none;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-bottom:1px solid var(--color-divider);background:var(--color-bg);z-index:5">
      <sc-if value="{{ ui.showBack }}">
        <button type="button" onClick="{{ handlers.goBack }}" aria-label="Volver" style="width:36px;height:36px;border-radius:999px;border:none;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"></path><path d="M19 12H5"></path></svg>
        </button>
      </sc-if>
      <div style="flex:1;min-width:0">
        <h4 style="margin:0;font-size:19px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" >{{ ui.title }}</h4>
      </div>
      <sc-if value="{{ ui.showSearchIcon }}">
        <button type="button" onClick="{{ handlers.openSearch }}" aria-label="Buscar" style="width:36px;height:36px;border-radius:999px;border:none;background:var(--color-surface);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><path d="m21 21-4.3-4.3"></path></svg>
        </button>
      </sc-if>
      <sc-if value="{{ ui.showFilterIcon }}">
        <button type="button" onClick="{{ handlers.toggleFilters }}" aria-label="Filtros" style="width:36px;height:36px;border-radius:999px;border:none;background:{{ ui.filterBtnBg }};color:{{ ui.filterBtnColor }};display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"></line><line x1="8" x2="16" y1="12" y2="12"></line><line x1="11" x2="13" y1="18" y2="18"></line></svg>
        </button>
      </sc-if>
    </div>

    <!-- Scrollable content -->
    <div class="om-scroll" style="flex:1;overflow-y:auto;overflow-x:hidden;padding-bottom:96px">

      <sc-if value="{{ screens.dashboard }}" hint-placeholder-val="{{ true }}">
        <dc-import name="ScreenDashboard" data="{{ dash }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.rooms }}">
        <dc-import name="ScreenRooms" data="{{ roomsData }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.roomDetail }}">
        <dc-import name="ScreenRoomDetail" data="{{ roomDetailData }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.payments }}">
        <dc-import name="ScreenPayments" data="{{ paymentsData }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.paymentDetail }}">
        <dc-import name="ScreenPaymentDetail" data="{{ paymentDetailData }}" handlers="{{ handlers }}" hint-size="100%,600px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.tenants }}">
        <dc-import name="ScreenTenants" data="{{ tenantsData }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.tenantDetail }}">
        <dc-import name="ScreenTenantDetail" data="{{ tenantDetailData }}" handlers="{{ handlers }}" hint-size="100%,800px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.more }}">
        <dc-import name="ScreenMore" data="{{ moreData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.complexes }}">
        <dc-import name="ScreenComplexes" data="{{ complexesData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.complexDetail }}">
        <dc-import name="ScreenComplexDetail" data="{{ complexDetailData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.prospects }}">
        <dc-import name="ScreenProspects" data="{{ prospectsData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.contracts }}">
        <dc-import name="ScreenContracts" data="{{ contractsData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.services }}">
        <dc-import name="ScreenServices" data="{{ servicesData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.maintenance }}">
        <dc-import name="ScreenMaintenance" data="{{ maintData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.documents }}">
        <dc-import name="ScreenDocuments" data="{{ documentsData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.reports }}">
        <dc-import name="ScreenReports" data="{{ reportsData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.settings }}">
        <dc-import name="ScreenSettings" data="{{ settingsData }}" handlers="{{ handlers }}" hint-size="100%,700px"></dc-import>
      </sc-if>

      <sc-if value="{{ screens.accounts }}">
        <dc-import name="ScreenAccounts" data="{{ accountsData }}" handlers="{{ handlers }}" hint-size="100%,600px"></dc-import>
      </sc-if>

    </div>

    <!-- FAB -->
    <sc-if value="{{ ui.showFab }}">
      <div style="position:absolute;right:16px;bottom:80px;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:20">
        <sc-if value="{{ ui.fabOpen }}">
          <div class="om-fade" style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
            <button type="button" onClick="{{ handlers.openAddPayment }}" style="display:flex;align-items:center;gap:8px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;padding:9px 16px 9px 10px;box-shadow:var(--shadow-md);cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--color-text)">
              <span style="width:28px;height:28px;border-radius:999px;background:var(--color-accent-2-100);color:var(--color-accent-2-800);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg></span>
              Registrar pago
            </button>
            <button type="button" onClick="{{ handlers.openAddTenant }}" style="display:flex;align-items:center;gap:8px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;padding:9px 16px 9px 10px;box-shadow:var(--shadow-md);cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--color-text)">
              <span style="width:28px;height:28px;border-radius:999px;background:var(--color-accent-100);color:var(--color-accent-800);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></span>
              Nuevo inquilino
            </button>
            <button type="button" onClick="{{ handlers.openAddRoom }}" style="display:flex;align-items:center;gap:8px;background:var(--color-bg);border:1px solid var(--color-divider);border-radius:999px;padding:9px 16px 9px 10px;box-shadow:var(--shadow-md);cursor:pointer;font-family:var(--font-body);font-size:13px;color:var(--color-text)">
              <span style="width:28px;height:28px;border-radius:999px;background:var(--color-neutral-200);color:var(--color-neutral-800);display:flex;align-items:center;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg></span>
              Nueva habitación
            </button>
          </div>
        </sc-if>
        <button type="button" onClick="{{ handlers.toggleFab }}" aria-label="Acciones rápidas" style="width:56px;height:56px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);border:none;box-shadow:var(--shadow-lg);display:flex;align-items:center;justify-content:center;cursor:pointer;transform:{{ ui.fabRotate }}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg>
        </button>
      </div>
    </sc-if>

    <!-- Bottom nav -->
    <div style="flex:none;display:flex;align-items:stretch;border-top:1px solid var(--color-divider);background:var(--color-bg);position:relative;z-index:10">
      <button type="button" onClick="{{ handlers.goDashboard }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;border:none;background:transparent;cursor:pointer;color:{{ ui.navColors.dashboard }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"></path></svg>
        <span style="font-size:10.5px">Inicio</span>
      </button>
      <button type="button" onClick="{{ handlers.goRooms }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;border:none;background:transparent;cursor:pointer;color:{{ ui.navColors.rooms }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"></path><path d="M5 21V7l8-4v18"></path><path d="M19 21V11l-6-4"></path></svg>
        <span style="font-size:10.5px">Habitaciones</span>
      </button>
      <button type="button" onClick="{{ handlers.goPayments }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;border:none;background:transparent;cursor:pointer;color:{{ ui.navColors.payments }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"></rect><line x1="2" y1="10" x2="22" y2="10"></line></svg>
        <span style="font-size:10.5px">Pagos</span>
      </button>
      <button type="button" onClick="{{ handlers.goTenants }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;border:none;background:transparent;cursor:pointer;color:{{ ui.navColors.tenants }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M22 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
        <span style="font-size:10.5px">Inquilinos</span>
      </button>
      <button type="button" onClick="{{ handlers.goMore }}" style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 10px;border:none;background:transparent;cursor:pointer;color:{{ ui.navColors.more }}">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="19" cy="12" r="1.6"></circle></svg>
        <span style="font-size:10.5px">Más</span>
      </button>
    </div>

    <!-- Toast -->
    <sc-if value="{{ ui.toast }}">
      <div class="om-fade" style="position:absolute;left:50%;transform:translateX(-50%);bottom:100px;background:var(--color-neutral-900);color:var(--color-neutral-100);padding:9px 16px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow-lg);z-index:60;white-space:nowrap">{{ ui.toast }}</div>
    </sc-if>

    <!-- Modals -->
    <sc-if value="{{ ui.modal }}">
      <dc-import name="AppModal" modal="{{ ui.modal }}" data="{{ modalData }}" handlers="{{ handlers }}" hint-size="100%,100%"></dc-import>
    </sc-if>
  </sc-if>

  <sc-if value="{{ ui.showOnboarding }}">
    <dc-import name="OnboardingTour" data="{{ onboardingData }}" hint-size="100%,100%"></dc-import>
  </sc-if>

  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;colorAvailable&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#A8D8B9&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colores de estado (semáforo)&quot;},&quot;colorOccupied&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F4A9A0&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colores de estado (semáforo)&quot;},&quot;colorReserved&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#F6D186&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colores de estado (semáforo)&quot;},&quot;colorMaintenance&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#C9C4BB&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Colores de estado (semáforo)&quot;}}">
class Component extends DCLogic {
  state = {
    loaded: false,
    screen: 'dashboard', backScreen: null,
    complexes: [], rooms: [], tenants: [], prospects: [], contracts: [], payments: [],
    services: [], maintenance: [], incidents: [], documents: [], bankAccounts: {},
    notifications: [], activity: [], calendarEvents: [],
    selectedRoomId: null, selectedTenantId: null, selectedComplexId: null, selectedPaymentId: null,
    roomFilters: { complex: 'all', status: 'all', furnished: 'all', maxPrice: 16000 },
    roomsFilterOpen: false, roomsView: 'list',
    tenantsTab: 'active', tenantsQuery: '',
    paymentsTab: 'all', paymentsQuery: '',
    prospectsFilter: 'all',
    contractsFilter: 'all',
    servicesComplexFilter: 'all',
    maintTab: 'maintenance',
    docsCategory: null,
    settingsComplexId: null,
    settingsState: {},
    a11y: { fontSize: 'normal', readableFont: false, highContrast: false },
    reminderTemplate: 'Hola {nombre}, te recordamos que tu pago de renta de {monto} vence el {fecha}. ¡Gracias!',
    session: null, showOnboarding: false, onboardingStep: 0,
    fabOpen: false,
    modal: null,
    toast: null,
    addPaymentForm: { tenantId: '', amount: '', method: 'Transferencia', status: 'pending' },
    addTenantForm: { name: '', phone: '', email: '', occupation: '', roomId: '' },
    addRoomForm: { complexId: '', number: '', name: '', type: 'Habitación privada', rent: '', furnished: false },
    addComplexForm: { name: '', address: '', mapsLink: '', manager: '', phone: '', notes: '' },
    accounts: [],
    addAccountForm: { type: 'bank', alias: '', complexId: '', bank: '', holder: '', clabe: '', account: '', selectedRoomIds: [] },
    withdrawForm: { amount: '', note: '' },
    selectedAccountId: null,
    moveOutDate: '',
  };

  componentDidMount() {
    try {
      const saved = JSON.parse(localStorage.getItem('pm_a11y') || 'null');
      if (saved) this.state.a11y = saved;
    } catch (e) {}
    try {
      const t = localStorage.getItem('pm_reminder_template');
      if (t) this.state.reminderTemplate = t;
    } catch (e) {}
    const savedSession = localStorage.getItem('pm_session');
    if (savedSession) { this.setState({ session: savedSession }); this.loadData(savedSession); }
  }
  loadData(mode) {
    if (mode === 'empty') {
      this.setState({
        loaded: true, complexes: [], rooms: [], tenants: [], prospects: [], contracts: [], payments: [],
        services: [], maintenance: [], incidents: [], documents: [], accounts: [], notifications: [],
        activity: [], calendarEvents: [], settingsComplexId: null,
      });
      this.maybeShowOnboarding();
      return;
    }
    import('./sample-data.js').then(m => {
      this.sampleData = m;
      this.setState({
        loaded: true, complexes: m.COMPLEXES, rooms: m.ROOMS, tenants: m.TENANTS, prospects: m.PROSPECTS,
        contracts: m.CONTRACTS, payments: m.PAYMENTS, services: m.SERVICES, maintenance: m.MAINTENANCE,
        incidents: m.INCIDENTS, documents: m.DOCUMENTS, accounts: [], notifications: m.NOTIFICATIONS,
        activity: m.ACTIVITY, calendarEvents: m.CALENDAR_EVENTS, settingsComplexId: m.COMPLEXES[0].id,
      });
      this.maybeShowOnboarding();
      const timeout = (ms) => new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms));
      Promise.race([import('./db.js'), timeout(6000)]).then(async (db) => {
        this.db = db;
        let data = await Promise.race([db.loadAll(), timeout(6000)]);
        if (!data.complexes.length) {
          await db.seedAll(m);
          data = await db.loadAll();
        }
        this.setState({
          complexes: data.complexes, rooms: data.rooms, tenants: data.tenants, prospects: data.prospects,
          contracts: data.contracts, payments: data.payments, services: data.services,
          maintenance: data.maintenance, incidents: data.incidents, documents: data.documents,
          accounts: data.accounts, settingsComplexId: data.complexes[0] ? data.complexes[0].id : this.state.settingsComplexId,
        });
      }).catch(err => { console.error('Supabase unavailable, staying on local data', err); this.db = null; });
    });
  }
  maybeShowOnboarding() {
    if (!localStorage.getItem('pm_onboarding_seen')) this.setState({ showOnboarding: true, onboardingStep: 0 });
  }
  findAccountForRoom(room) {
    if (!room) return null;
    const S = this.state;
    return S.accounts.find(a => a.roomIds && a.roomIds.includes(room.id))
      || S.accounts.find(a => a.complexId === room.complexId && (!a.roomIds || a.roomIds.length === 0))
      || S.accounts.find(a => a.complexId === room.complexId) || null;
  }
  addMovement = (accountId, amount, type, note) => {
    if (!accountId || !amount) return;
    let newBalance = 0;
    const mv = { id: 'mv' + Date.now(), date: new Date().toISOString().slice(0, 10), amount, type, note };
    this.setState({
      accounts: this.state.accounts.map(a => {
        if (a.id !== accountId) return a;
        newBalance = a.balance + (type === 'deposit' ? amount : -amount);
        return { ...a, balance: newBalance, movements: [mv, ...a.movements] };
      }),
    });
    if (this.db) { this.db.insertMovement(accountId, mv).catch(e => console.error(e)); this.db.updateAccountBalance(accountId, newBalance).catch(e => console.error(e)); }
  };

  // ---- status meta helpers ----
  roomStatusMeta(s) {
    const p = this.props || {};
    const m = {
      available: { label: 'Disponible', color: p.colorAvailable ?? '#A8D8B9' },
      reserved: { label: 'Reservada', color: p.colorReserved ?? '#F6D186' },
      soon: { label: 'Próx. disponible', color: '#cf8a4a' },
      occupied: { label: 'Ocupada', color: p.colorOccupied ?? '#F4A9A0' },
      maintenance: { label: 'Mantenimiento', color: p.colorMaintenance ?? '#C9C4BB' },
    };
    return m[s] || m.available;
  }
  paymentStatusMeta(s) {
    const m = {
      paid: { label: 'Pagado', color: '#7a9b6e' },
      pending: { label: 'Pendiente', color: '#d4a13d' },
      partial: { label: 'Parcial', color: '#cf8a4a' },
      overdue: { label: 'Vencido', color: '#b5544a' },
    };
    return m[s] || m.pending;
  }
  contractStatusMeta(s) {
    const m = {
      active: { label: 'Activo', color: '#7a9b6e' },
      expiring: { label: 'Por vencer', color: '#d4a13d' },
      ended: { label: 'Finalizado', color: '#8a8478' },
    };
    return m[s] || m.active;
  }
  serviceStatusMeta(s) {
    const m = {
      al_corriente: { label: 'Al corriente', color: '#7a9b6e' },
      pendiente: { label: 'Pendiente', color: '#d4a13d' },
      vencido: { label: 'Vencido', color: '#b5544a' },
    };
    return m[s] || m.al_corriente;
  }
  maintStatusMeta(s) {
    const m = {
      programado: { label: 'Programado', color: '#8a8478' },
      en_progreso: { label: 'En progreso', color: '#d4a13d' },
      completado: { label: 'Completado', color: '#7a9b6e' },
    };
    return m[s] || m.programado;
  }
  incidentMeta(s) {
    const m = {
      abierto: { label: 'Abierto', color: '#b5544a' },
      en_progreso: { label: 'En progreso', color: '#d4a13d' },
      resuelto: { label: 'Resuelto', color: '#7a9b6e' },
    };
    return m[s] || m.abierto;
  }
  priorityMeta(s) {

        complexes: S.complexes,
        rooms: roomsForComplex.map(r => ({ id: r.id, label: r.number + ' · ' + r.name, checked: f.selectedRoomIds.includes(r.id), onToggle: () => h.toggleAddAccountRoom(r.id) })),
        hasComplex: !!f.complexId,
      };
    }
    if (S.modal === 'withdraw') {
      const acc = S.accounts.find(a => a.id === S.selectedAccountId);
      modalData.withdraw = acc ? {
        alias: acc.alias, balanceFmt: this.money(acc.balance), amount: S.withdrawForm.amount, note: S.withdrawForm.note,
        onAmount: (e) => h.updateWithdrawForm('amount', e.target.value),
        onNote: (e) => h.updateWithdrawForm('note', e.target.value),
        onSubmit: h.submitWithdraw,
      } : null;
    }
    if (S.modal === 'confirmMarkPaid') {
      const p = S.payments.find(x => x.id === S.selectedPaymentId);
      modalData.confirmMarkPaid = p ? {
        tenantName: this.tenantName(p.tenantId), period: p.period, amountFmt: this.money(p.amount),
        nextPeriod: this.nextPeriodLabel(p.period), onConfirm: h.confirmMarkPaid,
      } : null;
    }
    if (S.modal === 'addComplex') {
      const f = S.addComplexForm;
      modalData.addComplex = {
        name: f.name, address: f.address, mapsLink: f.mapsLink, manager: f.manager, phone: f.phone, notes: f.notes,
        onName: (e) => h.updateAddComplexForm('name', e.target.value),
        onAddress: (e) => h.updateAddComplexForm('address', e.target.value),
        onMapsLink: (e) => h.updateAddComplexForm('mapsLink', e.target.value),
        onManager: (e) => h.updateAddComplexForm('manager', e.target.value),
        onPhone: (e) => h.updateAddComplexForm('phone', e.target.value),
        onNotes: (e) => h.updateAddComplexForm('notes', e.target.value),
        onSubmit: h.submitAddComplex,
      };
    }
    if (S.modal === 'addPayment') {
      const f = S.addPaymentForm;
      modalData.addPayment = {
        amount: f.amount, method: f.method, status: f.status,
        onTenant: (e) => h.updateAddPaymentForm('tenantId', e.target.value),
        onAmount: (e) => h.updateAddPaymentForm('amount', e.target.value),
        onMethod: (e) => h.updateAddPaymentForm('method', e.target.value),
        onStatus: (e) => h.updateAddPaymentForm('status', e.target.value),
        onSubmit: h.submitAddPayment,
        tenants: S.tenants.filter(t => t.active),
      };
    }
    if (S.modal === 'addTenant') {
      const f = S.addTenantForm;
      modalData.addTenant = {
        name: f.name, phone: f.phone, email: f.email, occupation: f.occupation,
        onName: (e) => h.updateAddTenantForm('name', e.target.value),
        onPhone: (e) => h.updateAddTenantForm('phone', e.target.value),
        onEmail: (e) => h.updateAddTenantForm('email', e.target.value),
        onOccupation: (e) => h.updateAddTenantForm('occupation', e.target.value),
        onRoom: (e) => h.updateAddTenantForm('roomId', e.target.value),
        onSubmit: h.submitAddTenant,
        rooms: S.rooms.filter(r => r.status === 'available' || r.status === 'soon').map(r => ({ ...r, complexName: this.complexName(r.complexId) })),
      };
    }
    if (S.modal === 'addRoom') {
      const f = S.addRoomForm;
      modalData.addRoom = {
        number: f.number, name: f.name, rent: f.rent,
        onComplex: (e) => h.updateAddRoomForm('complexId', e.target.value),
        onNumber: (e) => h.updateAddRoomForm('number', e.target.value),
        onName: (e) => h.updateAddRoomForm('name', e.target.value),
        onType: (e) => h.updateAddRoomForm('type', e.target.value),
        onRent: (e) => h.updateAddRoomForm('rent', e.target.value),
        onFurnished: (e) => h.updateAddRoomForm('furnished', e.target.checked),
        onSubmit: h.submitAddRoom,
        complexes: S.complexes,
      };
    }
    if (S.modal === 'shareRoom') {
      const r = S.rooms.find(x => x.id === S.selectedRoomId);
      if (r) {
        const cx = S.complexes.find(c => c.id === r.complexId);
        const mapsUrl = cx ? (cx.mapsLink || (cx.gps ? 'https://www.google.com/maps?q=' + encodeURIComponent(cx.gps) : '')) : '';
        const featuresLine = r.tags.length ? r.tags.join(', ') : 'sin extras registrados';
        const servicesLine = r.included.length ? r.included.join(', ') : 'sin servicios incluidos';
        const message = '✨ ' + r.name + ' — ' + this.money(r.rent) + '/mes\n'
          + '📍 ' + (cx ? cx.address : '') + '\n'
          + '🛋️ Servicios incluidos: ' + servicesLine + '\n'
          + '🏷️ Características: ' + featuresLine + '\n'
          + '📸 Te comparto fotos de la habitación en este chat.\n'
          + (mapsUrl ? ('📌 Ubicación: ' + mapsUrl) : '');
        modalData.shareRoom = {
          ...r, meta: this.roomStatusMeta(r.status), complexName: cx ? cx.name : '', rentFmt: this.money(r.rent),
          message, mapsUrl, hasMaps: !!mapsUrl,
          whatsappUrl: 'https://wa.me/?text=' + encodeURIComponent(message),
        };
      } else modalData.shareRoom = null;
    }
    if (S.modal === 'confirmInactive') {
      const t = S.tenants.find(x => x.id === S.selectedTenantId);
      modalData.confirmInactive = { tenant: t, moveOutDate: S.moveOutDate, onDate: (e) => h.setMoveOutDate(e.target.value), onConfirm: h.confirmInactivate };
    }
    if (S.modal === 'search') {
      modalData.search = { rooms: S.rooms.map(r => ({ ...r, complexName: this.complexName(r.complexId) })), tenants: S.tenants, complexes: S.complexes };
    }

    const roomNums = (ids) => ids.map(id => { const r = S.rooms.find(x => x.id === id); return r ? r.number : ''; }).filter(Boolean).join(', ');
    const accountsData = {
      loaded: S.loaded, onAdd: h.openAddAccount,
      totalFmt: this.money(S.accounts.reduce((a, c) => a + (c.balance || 0), 0)),
      list: S.accounts.map(a => {
        let scopeLabel = 'General (todas las propiedades)';
        if (a.complexId) {
          scopeLabel = this.complexName(a.complexId) + (a.roomIds && a.roomIds.length ? ' · Hab. ' + roomNums(a.roomIds) : ' · Todo el complejo');
        }
        return {
          id: a.id, alias: a.alias, isCash: a.type === 'cash', typeLabel: a.type === 'cash' ? 'Efectivo' : 'Cuenta bancaria',
          scopeLabel, bank: a.bank, holder: a.holder, clabe: a.clabe, balanceFmt: this.money(a.balance),
          onWithdraw: () => h.openWithdraw(a.id),
          movements: a.movements.slice(0, 5).map(m => ({ ...m, sign: m.type === 'deposit' ? '+' : '−', amountFmt: this.money(m.amount), color: m.type === 'deposit' ? '#7a9b6e' : '#b5544a' })),
        };
      }),
    };

    return { ui, screens, handlers: h, dash, roomsData, roomDetailData, paymentsData, paymentDetailData, tenantsData, tenantDetailData, moreData, complexesData, complexDetailData, prospectsData, contractsData, servicesData, maintData, documentsData, reportsData, settingsData, accountsData, modalData, onboardingData };
  }
}

</script>
</body>
</html>
