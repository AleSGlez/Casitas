<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;background:color-mix(in srgb, var(--color-neutral-900) 60%, transparent);display:flex;align-items:center;justify-content:center;z-index:80;padding:24px">
  <div style="background:var(--color-bg);border-radius:var(--radius-lg);padding:24px 22px;box-shadow:var(--shadow-lg);width:100%">
    <div style="display:flex;gap:6px;margin-bottom:16px">
      <sc-for list="{{ data.dots }}" as="d" hint-placeholder-count="5">
        <span style="height:5px;flex:1;border-radius:999px;background:{{ d.active }}"></span>
      </sc-for>
    </div>
    <h3 style="margin:0 0 8px">{{ data.current.title }}</h3>
    <p style="font-size:13.5px;opacity:0.75;margin-bottom:22px">{{ data.current.body }}</p>
    <div style="display:flex;gap:8px">
      <button type="button" class="btn btn-ghost" onClick="{{ data.onSkip }}">Omitir</button>
      <sc-if value="{{ data.showPrev }}">
        <button type="button" class="btn btn-secondary" onClick="{{ data.onPrev }}">Atrás</button>
      </sc-if>
      <div style="flex:1"></div>
      <button type="button" class="btn btn-primary" onClick="{{ data.onNext }}">{{ data.nextLabel }}</button>
    </div>
  </div>
</div>

</x-dc>
</body>
</html>
