<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div>
  <sc-if value="{{ data.loaded }}" hint-placeholder-val="{{ false }}">
    <div style="height:150px;background:linear-gradient(135deg,var(--color-accent-300),var(--color-accent-2-200))"></div>
    <div style="padding:var(--space-4)">
      <h3 style="margin:0 0 4px">{{ data.complex.name }}</h3>
      <div style="font-size:13px;opacity:0.65;margin-bottom:14px">{{ data.complex.address }}</div>
      <div style="display:flex;gap:8px;margin-bottom:16px">
        <a href="tel:{{ data.complex.phone }}" class="btn btn-secondary" style="flex:1;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a1.03 1.03 0 0 0-1.05.24l-1.57 1.97a11.36 11.36 0 0 1-5.86-5.86l1.95-1.66a1 1 0 0 0 .25-1.05 11.36 11.36 0 0 1-.56-3.53 1 1 0 0 0-1-1H5.03a1 1 0 0 0-1 1c0 9.39 7.61 17 17 17a1 1 0 0 0 1-1v-3.44a1 1 0 0 0-1-1"/></svg>{{ data.complex.phone }}</a>
        <sc-if value="{{ data.complex.hasMaps }}" hint-placeholder-val="{{ true }}">
          <a href="{{ data.complex.mapsUrl }}" target="_blank" class="btn btn-secondary" style="flex:1;justify-content:center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>Mapa</a>
        </sc-if>
      </div>

      <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
        <div style="display:flex;justify-content:space-between;font-size:13px"><span style="opacity:0.6">Encargado</span><strong>{{ data.complex.manager }}</strong></div>
      </div>
      <p style="font-size:12.5px;opacity:0.7;margin-bottom:18px">{{ data.complex.notes }}</p>

      <h5 style="margin:0 0 8px">Habitaciones</h5>
      <div style="display:flex;flex-direction:column;gap:8px">
        <sc-for list="{{ data.rooms }}" as="r" hint-placeholder-count="4">
          <button type="button" onClick="{{ r.onOpen }}" style="all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:var(--color-surface);border-radius:var(--radius-md);padding:11px 13px">
            <span style="font-size:13px">{{ r.number }} · {{ r.name }}</span>
            <span style="display:flex;align-items:center;gap:6px;font-size:11.5px"><span style="width:7px;height:7px;border-radius:999px;background:{{ r.meta.color }}"></span>{{ r.meta.label }}</span>
          </button>
        </sc-for>
      </div>
    </div>
  </sc-if>
</div>

</x-dc>
</body>
</html>
