<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;background:linear-gradient(180deg,var(--color-accent-100),var(--color-bg) 40%)">
  <div style="width:64px;height:64px;border-radius:999px;background:var(--color-accent);color:var(--color-bg);display:flex;align-items:center;justify-content:center;margin-bottom:18px">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.75"><path d="M3 21h18"/><path d="M5 21V7l8-4v18"/><path d="M19 21V11l-6-4"/></svg>
  </div>
  <h2 style="margin:0 0 4px">Casitas</h2>
  <p style="font-size:13px;opacity:0.65;margin-bottom:24px">Administra tus complejos, habitaciones, inquilinos y pagos desde una sola app.</p>

  <div class="field" style="margin-bottom:10px"><label>Correo</label><input class="input" placeholder="tu@correo.com" /></div>
  <div class="field" style="margin-bottom:16px"><label>Contraseña</label><input class="input" type="password" placeholder="••••••••" /></div>
  <button type="button" class="btn btn-primary btn-block" onClick="{{ handlers.loginDemo }}" style="margin-bottom:22px">Iniciar sesión</button>

  <div style="display:flex;align-items:center;gap:10px;margin-bottom:18px">
    <div style="flex:1;height:1px;background:var(--color-divider)"></div>
    <span style="font-size:11px;opacity:0.5">o</span>
    <div style="flex:1;height:1px;background:var(--color-divider)"></div>
  </div>

  <button type="button" class="btn btn-secondary btn-block" onClick="{{ handlers.loginDemo }}" style="margin-bottom:10px">Probar cuenta demo (con datos de ejemplo)</button>
  <button type="button" class="btn btn-ghost btn-block" onClick="{{ handlers.loginEmpty }}">Empezar una prueba desde cero</button>
</div>

</x-dc>
</body>
</html>
