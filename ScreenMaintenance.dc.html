<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <div class="seg" style="margin-bottom:14px;display:inline-flex">
    <sc-for list="{{ data.tabs }}" as="t" hint-placeholder-count="2">
      <button type="button" onClick="{{ t.onSelect }}" style="all:unset;box-sizing:border-box;cursor:pointer;font-size:12.5px;padding:7px 13px;border-radius:999px;background:{{ t.bg }};color:{{ t.fg }}">{{ t.label }}</button>
    </sc-for>
  </div>

  <sc-if value="{{ data.isMaint }}" hint-placeholder-val="{{ true }}">
    <div style="display:flex;flex-direction:column;gap:9px">
      <sc-for list="{{ data.maintenance }}" as="m" hint-placeholder-count="4">
        <button type="button" onClick="{{ m.onCycle }}" style="all:unset;box-sizing:border-box;cursor:pointer;background:var(--color-surface);border-radius:var(--radius-md);padding:12px 14px;display:block">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="font-size:13.5px;font-family:var(--font-heading)">{{ m.category }}</span>
            <span class="tag tag-neutral" style="color:{{ m.meta.color }}">{{ m.meta.label }}</span>
          </div>
          <div style="font-size:12px;opacity:0.7;margin-bottom:4px">{{ m.description }}</div>
          <div style="font-size:11.5px;opacity:0.6">{{ m.complexName }} · {{ m.assignedTo }} · {{ m.date }} · {{ m.costFmt }}</div>
        </button>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{ data.isIncidents }}">
    <div style="display:flex;flex-direction:column;gap:9px">
      <sc-for list="{{ data.incidents }}" as="i" hint-placeholder-count="4">
        <button type="button" onClick="{{ i.onCycle }}" style="all:unset;box-sizing:border-box;cursor:pointer;background:var(--color-surface);border-radius:var(--radius-md);padding:12px 14px;display:block">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
            <span style="display:flex;align-items:center;gap:7px;font-size:13.5px;font-family:var(--font-heading)"><span style="width:7px;height:7px;border-radius:999px;background:{{ i.priorityMeta.color }}"></span>{{ i.category }}</span>
            <span class="tag tag-neutral" style="color:{{ i.meta.color }}">{{ i.meta.label }}</span>
          </div>
          <div style="font-size:12px;opacity:0.7;margin-bottom:4px">{{ i.description }}</div>
          <div style="font-size:11.5px;opacity:0.6">{{ i.complexName }} · {{ i.assignedTo }} · {{ i.comments }} comentarios</div>
        </button>
      </sc-for>
    </div>
  </sc-if>
</div>

</x-dc>
</body>
</html>
