<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:var(--space-4)">
  <div style="display:flex;gap:7px;overflow-x:auto;margin-bottom:14px;padding-bottom:2px">
    <sc-for list="{{ data.complexFilters }}" as="c" hint-placeholder-count="4">
      <button type="button" onClick="{{ c.onSelect }}" style="flex:none;font-size:12px;padding:7px 12px;border-radius:999px;border:1px solid var(--color-divider);cursor:pointer;background:{{ c.bg }};color:{{ c.fg }}">{{ c.name }}</button>
    </sc-for>
  </div>
  <div style="display:flex;flex-direction:column;gap:9px">
    <sc-for list="{{ data.list }}" as="s" hint-placeholder-count="5">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start">
          <div>
            <div class="card-title" style="font-size:15px">{{ s.type }}</div>
            <div style="font-size:11.5px;opacity:0.6">{{ s.provider }} · {{ s.complexName }}</div>
          </div>
          <span class="tag tag-neutral" style="color:{{ s.meta.color }}">{{ s.meta.label }}</span>
        </div>
        <div style="font-size:12px;opacity:0.75">Vence: {{ s.dueDate }} · {{ s.frequency }} · {{ s.scope }}</div>
        <sc-if value="{{ s.canMarkPaid }}">
          <button type="button" class="btn btn-secondary" onClick="{{ s.onMarkPaid }}" style="align-self:flex-start;margin-top:2px">Marcar al corriente</button>
        </sc-if>
      </div>
    </sc-for>
  </div>
</div>

</x-dc>
</body>
</html>
